[project]
name = "drug-price-optimization"
version = "0.1.0"
description = "Multi-agent drug price optimization pipeline built on CMS NADAC data using Agno."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.0,<2.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "transformers>=5.22.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
